# LEGACY: GLPI 10.0 images, delete this file (and `docker-bake.glpi-10.hcl`) with the GLPI 10.0 end of life.
name: "GLPI Github Actions GLPI 10.0/Apache images (legacy)"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/githubactions-glpi-apache-legacy.yml"
      - "githubactions-glpi-apache/**"
      - "githubactions-php-apache/**"
      - "githubactions-base/**"
      - "docker-bake.glpi-10.hcl"
      - "docker-bake.hcl"
  pull_request:
    paths:
      - ".github/workflows/githubactions-glpi-apache-legacy.yml"
      - "githubactions-glpi-apache/**"
      - "githubactions-php-apache/**"
      - "githubactions-base/**"
      - "docker-bake.glpi-10.hcl"
      - "docker-bake.hcl"
  schedule:
    - cron: '0 22 * * *'
  # Enable manual run
  workflow_dispatch:

# Cancel the previous run of a pull request when it is updated (other events have a unique group and are never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-26.04"
    env:
      # Images are only pushed from the upstream repository, forks must opt in with the `PUSH_IMAGES` repository variable
      PUSH: ${{ github.ref == 'refs/heads/main' && (github.repository == 'glpi-project/docker-images' || vars.PUSH_IMAGES == 'true') }}
      # Registry of the images, forks can change it with the `GHCR_NAMESPACE` repository variable
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE || 'ghcr.io/glpi-project' }}
      # Secrets are not available on pull requests coming from forks (and Dependabot)
      DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_TOKEN != '' }}
      GHA_CACHE: "true"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to DockerHub"
        if: ${{ env.DOCKER_HUB_LOGIN == 'true' }}
        uses: "docker/login-action@v4"
        with:
          username: "${{ secrets.DOCKER_HUB_USERNAME }}"
          password: "${{ secrets.DOCKER_HUB_TOKEN }}"
      - name: "Login to Github container registry"
        if: ${{ env.PUSH == 'true' }}
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_ACCESS_TOKEN }}"
      - name: "Build and push"
        uses: "docker/bake-action@v7"
        with:
          files: |
            ./docker-bake.hcl
            ./docker-bake.glpi-10.hcl
          targets: "githubactions-glpi-apache-legacy"
          push: ${{ env.PUSH == 'true' }}
