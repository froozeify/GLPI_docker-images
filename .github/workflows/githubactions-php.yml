name: "Github actions PHP images"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/githubactions-php.yml"
      - "githubactions-php/**"
      - "githubactions-base/**"
      - "docker-bake.hcl"
  pull_request:
    paths:
      - ".github/workflows/githubactions-php.yml"
      - "githubactions-php/**"
      - "githubactions-base/**"
      - "docker-bake.hcl"
  schedule:
    - cron:  '0 0 * * 1'
  # Enable manual run
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php-version: "8.2", slug: "8-2"}
          - {php-version: "8.3", slug: "8-3"}
          - {php-version: "8.4", slug: "8-4"}
          - {php-version: "8.5", slug: "8-5"}
          - {php-version: "8.6", slug: "8-6"}
    steps:
      - name: "Set variables"
        run: |
          OUTPUTS="type=image"
          if [[ "${{ github.ref }}" = 'refs/heads/main' && "${{ github.repository }}" = 'glpi-project/docker-images' ]]; then
              OUTPUTS="$OUTPUTS,push=true"
          fi
          echo "OUTPUTS=$OUTPUTS" >> $GITHUB_ENV
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to DockerHub"
        uses: "docker/login-action@v4"
        with:
          username: "${{ secrets.DOCKER_HUB_USERNAME }}"
          password: "${{ secrets.DOCKER_HUB_TOKEN }}"
      - name: "Login to Github container registry"
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_ACCESS_TOKEN }}"
      - name: "Build and push"
        uses: "docker/bake-action@v7"
        with:
          targets: "githubactions-php-${{ matrix.slug }}"
          set: |
            *.pull=true
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            githubactions-php-${{ matrix.slug }}.output=${{ env.OUTPUTS }}
